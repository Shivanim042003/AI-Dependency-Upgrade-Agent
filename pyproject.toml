[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmigrate"
version = "0.1.0"
description = "Evaluated AI agent for Pydantic v1 -> v2 migrations, with a bump-pydantic baseline"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pytest>=8",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[project.scripts]
pmigrate = "pmigrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
